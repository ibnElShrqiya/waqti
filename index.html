<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F2EA" />
    <meta name="description" content="WAQTI — Organize Your Time. Take Control of Your Life." />
    <title>WAQTI</title>
    <script>
      // Apply persisted theme + locale before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('waqti.preferences');
          var s = raw ? JSON.parse(raw).state || {} : {};
          var locale = s.locale || ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en');
          var theme = s.theme || 'system';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.lang = locale;
          root.dir = locale === 'ar' ? 'rtl' : 'ltr';
          if (dark) root.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
